name: Daily scrape and publish

# 03:00 UTC is 07:00 in Dubai. Scheduled runs only fire from the repository's default
# branch, so this stays dormant until the branch is merged.
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

# Never let two runs publish at once; a queued run picks up the newer data anyway.
concurrency:
  group: daily-publish
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      # A free Supabase project pauses after seven days with no requests, and this app
      # only calls it when somebody opens a checklist, which is easily quieter than
      # that. One request a day from here keeps it awake. It runs before anything that
      # can fail, so a broken scrape still keeps the database alive, and it cannot fail
      # the job. The URL and key are read from data/backend.json and are already
      # public: the anon key ships inside the published page, and Row Level Security is
      # what protects the data.
      - name: Keep the Supabase project awake
        continue-on-error: true
        run: |
          set -uo pipefail
          if [ ! -f data/backend.json ]; then
            echo "no data/backend.json; nothing to keep awake"; exit 0
          fi
          URL=$(jq -r '.supabase_url // empty' data/backend.json)
          KEY=$(jq -r '.supabase_anon_key // empty' data/backend.json)
          if [ -z "$URL" ] || [ -z "$KEY" ]; then
            echo "backend not configured; nothing to keep awake"; exit 0
          fi
          CODE=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 \
            "${URL%/}/rest/v1/checklist_state?select=id&limit=1" \
            -H "apikey: ${KEY}" -H "Authorization: Bearer ${KEY}" || echo 000)
          # 200 is an empty allowed read, 401 and 403 are Row Level Security doing its
          # job. All three mean the project answered, which is the whole point. 540 is
          # the gateway's own code for a paused project, and a ping cannot wake one:
          # that needs a restore from the dashboard, so say so where it will be seen.
          case "$CODE" in
            540|522|503)
              echo "::warning::Supabase is paused (${CODE}); restore it in the dashboard"
              echo "**Supabase is paused.** A ping cannot wake it: open the dashboard and restore the project." >> "$GITHUB_STEP_SUMMARY"
              ;;
            2*|4*)
              echo "Supabase answered ${CODE}: project is awake"
              ;;
            *)
              echo "::warning::Supabase did not answer (${CODE})"
              echo "**Supabase did not answer** (${CODE}); checklist sync may be down." >> "$GITHUB_STEP_SUMMARY"
              ;;
          esac

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      # Detail pages are cached by URL so a daily run only fetches listings plus any
      # event it has not seen. The runner is fresh each time, so the cache has to be
      # carried across runs. A run-scoped key always saves; restore-keys pick up the
      # most recent previous cache.
      - name: Restore detail-page cache
        uses: actions/cache@v4
        with:
          path: .cache
          key: details-${{ github.run_id }}
          restore-keys: details-

      - name: Cache Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements-dev.txt') }}

      - name: Install Playwright browser
        run: python -m playwright install --with-deps chromium

      # Exits non-zero on a thin or empty scrape and leaves data/ untouched, which
      # leaves the previously published docs/ in place because nothing downstream runs.
      - name: Scrape Platinumlist
        run: python src/scrape.py

      # Must run before the new dataset is committed: it diffs the working tree against
      # the committed dataset, so committing first would make every day look quiet.
      - name: Detect changes
        run: python src/changes.py

      - name: Score dates
        run: python src/viability.py

      - name: Build site
        run: python src/build_site.py

      # Publishing a page whose filters are dead is worse than publishing nothing, so
      # this gates the commit rather than reporting after the fact.
      - name: Smoke-test the built page
        run: python tests/test_site.py

      - name: Commit and push when the dataset moved
        id: publish
        run: |
          set -euo pipefail

          # The published page no longer varies with the date it was built, so the only
          # thing that decides whether there is news is the dataset itself.
          if git diff --quiet data/events.json data/review_queue.json; then
            echo "no dataset change; leaving the published site as it is"
            git checkout -- docs/ data/ || true
            echo "published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Written as one line on purpose: inside a YAML block scalar every line is
          # indented, and Python would reject an indented heredoc body.
          SUMMARY=$(python -c "import json;c=json.load(open('docs/changes.json'))['summary'];print(', '.join(f'{c[k]} {l}' for k,l in [('added','added'),('removed','removed'),('changed','changed'),('dates_lost','dates lost'),('dates_gained','dates gained')] if c[k]) or 'dataset refreshed')")

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/events.json data/review_queue.json docs/
          git commit -m "Data update: ${SUMMARY}" \
                     -m "Generated by .github/workflows/daily.yml"

          for delay in 2 4 8 16 0; do
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              break
            fi
            if [ "$delay" = 0 ]; then
              echo "push failed after retries"; exit 1
            fi
            echo "push failed, retrying in ${delay}s"
            sleep "$delay"
            git pull --rebase origin "${GITHUB_REF_NAME}" || true
          done

          echo "published=true" >> "$GITHUB_OUTPUT"
          echo "summary=${SUMMARY}" >> "$GITHUB_OUTPUT"

      - name: Job summary
        if: always()
        run: |
          {
            echo "## Daily scrape"
            if [ "${{ steps.publish.outputs.published }}" = "true" ]; then
              echo "Published: ${{ steps.publish.outputs.summary }}"
            elif [ "${{ steps.publish.outcome }}" = "success" ]; then
              echo "No dataset change. Nothing committed, previous site left in place."
            else
              echo "Run failed before publishing. The previously published site is untouched."
            fi
            echo ""
            echo "\`docs/changes.json\` carries a \`generated\` date and a \`has_changes\`"
            echo "flag. Alerting should require both: \`has_changes\` true **and**"
            echo "\`generated\` equal to today, because on a quiet day nothing is"
            echo "committed and the file stays as it was."
          } >> "$GITHUB_STEP_SUMMARY"

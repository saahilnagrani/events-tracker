name: Daily scrape and publish

# 03:00 UTC is 07:00 in Dubai. Scheduled runs only fire from the repository's default
# branch, so this stays dormant until the branch is merged.
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

# Never let two runs publish at once; a queued run picks up the newer data anyway.
concurrency:
  group: daily-publish
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      # A free Supabase project pauses after seven days with no requests. The run
      # below talks to it anyway, but this goes first and cannot fail the job, so even
      # a run that dies in the scrape still counts as activity. The URL and key here
      # are the public ones: the anon key ships inside the page, and Row Level
      # Security is what protects the data.
      - name: Keep the Supabase project awake
        continue-on-error: true
        run: |
          set -uo pipefail
          if [ ! -f data/backend.json ]; then
            echo "no data/backend.json; nothing to keep awake"; exit 0
          fi
          URL=$(jq -r '.supabase_url // empty' data/backend.json)
          KEY=$(jq -r '.supabase_anon_key // empty' data/backend.json)
          if [ -z "$URL" ] || [ -z "$KEY" ]; then
            echo "backend not configured; nothing to keep awake"; exit 0
          fi
          CODE=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 \
            "${URL%/}/rest/v1/checklist_state?select=id&limit=1" \
            -H "apikey: ${KEY}" -H "Authorization: Bearer ${KEY}" || echo 000)
          # 200 is an empty allowed read, 401 and 403 are Row Level Security doing its
          # job. All three mean the project answered, which is the whole point. 540 is
          # the gateway's own code for a paused project, and a ping cannot wake one:
          # that needs a restore from the dashboard, so say so where it will be seen.
          case "$CODE" in
            540|522|503)
              echo "::warning::Supabase is paused (${CODE}); restore it in the dashboard"
              echo "**Supabase is paused.** A ping cannot wake it: open the dashboard and restore the project." >> "$GITHUB_STEP_SUMMARY"
              ;;
            2*|4*)
              echo "Supabase answered ${CODE}: project is awake"
              ;;
            *)
              echo "::warning::Supabase did not answer (${CODE})"
              echo "**Supabase did not answer** (${CODE}); checklist sync may be down." >> "$GITHUB_STEP_SUMMARY"
              ;;
          esac

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      # Detail pages are cached by URL so a daily run only fetches listings plus any
      # event it has not seen. The runner is fresh each time, so the cache has to be
      # carried across runs. A run-scoped key always saves; restore-keys pick up the
      # most recent previous cache.
      - name: Restore detail-page cache
        uses: actions/cache@v4
        with:
          path: .cache
          key: details-${{ github.run_id }}
          restore-keys: details-

      - name: Cache Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements-dev.txt') }}

      - name: Install Playwright browser
        run: python -m playwright install --with-deps chromium

      # The database is the store of record now, so the previous dataset comes from
      # it rather than from the repository: src/scrape.py reads data/events.json to
      # know what it saw yesterday, and src/changes.py diffs against the .prev copy
      # taken here before the scrape overwrites it.
      - name: Pull the previous dataset
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python src/publish.py --pull

      # Exits non-zero on a thin or empty scrape and leaves data/ untouched, which
      # leaves the published dataset in place because nothing downstream runs.
      - name: Scrape Platinumlist
        run: python src/scrape.py

      - name: Detect changes
        run: >-
          python src/changes.py --old data/events.prev.json
          --old-review data/review_queue.prev.json --out data/changes.json

      - name: Score dates
        run: python src/viability.py

      - name: Build site
        run: python src/build_site.py

      # The page is a shell, so this proves the shell still works against a stand-in
      # database. It gates publishing rather than reporting after the fact.
      - name: Smoke-test the built page
        run: python tests/test_site.py

      # Only once the page has been proved does the new dataset become the one the app
      # serves. The checklists table is deliberately untouched: it holds people's edits.
      - name: Publish the dataset
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python src/publish.py --push

      # The repository holds code. The only thing a run can change here is the built
      # shell, and that moves only when the shell itself has been edited.
      - name: Commit the rebuilt shell if it changed
        id: publish
        run: |
          set -euo pipefail

          if git diff --quiet docs/; then
            echo "shell unchanged; nothing to commit"
            echo "published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/
          git commit -m "Rebuild the published shell" \
                     -m "Generated by .github/workflows/daily.yml"

          for delay in 2 4 8 16 0; do
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              break
            fi
            if [ "$delay" = 0 ]; then
              echo "push failed after retries"; exit 1
            fi
            echo "push failed, retrying in ${delay}s"
            sleep "$delay"
            git pull --rebase origin "${GITHUB_REF_NAME}" || true
          done

          echo "published=true" >> "$GITHUB_OUTPUT"

      - name: Job summary
        if: always()
        run: |
          {
            echo "## Daily scrape"
            if [ -f data/changes.json ]; then
              python -c "import json;c=json.load(open('data/changes.json'));s=c['summary'];print('Dataset ' + c['generated'] + ': ' + (', '.join(f'{s[k]} {l}' for k,l in [('added','added'),('removed','removed'),('changed','changed'),('dates_lost','dates lost'),('dates_gained','dates gained')] if s[k]) or 'no change'))"
            else
              echo "Run failed before the dataset was rebuilt. The database still holds yesterday's."
            fi
            if [ "${{ steps.publish.outputs.published }}" = "true" ]; then
              echo ""
              echo "The published shell changed and was committed."
            fi
            echo ""
            echo "The dataset lives in Supabase, in the \`datasets\` table. The change"
            echo "summary is the \`changes\` row there, with a \`generated\` date and a"
            echo "\`has_changes\` flag. Alerting should require both: \`has_changes\` true"
            echo "**and** \`generated\` equal to today."
          } >> "$GITHUB_STEP_SUMMARY"
